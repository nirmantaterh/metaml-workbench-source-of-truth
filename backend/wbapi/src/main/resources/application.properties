spring.application.name=wbapi

#server configuration
# Loopback-only for this local demo setup: this port also serves the Camunda webapp
# (cockpit/admin/tasklist) with the default demo/demo admin account, and Spring Security is
# permitAll, so binding to 0.0.0.0 exposed a fully privileged process-engine console to
# anyone on the same network. The React app runs in a browser on this same machine and talks
# to http://localhost:8082, and the node manager call is outbound, so nothing local breaks.
server.address=127.0.0.1
server.port=8082

# Allow circular references (allow dependency cycle between beans)
# spring.main.allow-circular-references=true

# How many evolutions one twin is allowed before governance starts refusing. Uncomment to change
# it; the default below is what GovernanceServiceImpl falls back to, and the governance API can
# still raise or lower it while the app is running.
# workbench.governance.max-evolutions-per-twin=25

# Separate budget for the twin advancing its own token, one slot per activity it walks through.
# Much bigger number because it counts something much more common than an agent request.
# workbench.governance.max-twin-executions-per-twin=200

# No job-execution setting here on purpose, and please don't add one. There used to be
# camunda.bpm.job-execution.enabled=false, because the twin's activities were asyncBefore service
# tasks and the executor kept running their parked jobs a second or two after they appeared, which
# walked the twin to its end while the human was still on the first task. Turning the executor off
# fixed that and broke Task_Approve's PT8H boundary timer, the grad model's PT4H one, and history
# cleanup, all of which need it. The twin's activities are receive tasks now: a wait state with no
# row in ACT_RU_JOB, so there is nothing there for the executor to pick up and no reason left to
# touch it. BoundaryTimerWalkthroughTest is what keeps that honest.

# Datasource configs
# NOTE: switched from MySQL to H2 for Camunda (no MySQL server is installed/running on this
# machine, and Camunda's process engine needs a real, working datasource at boot).
# Original MySQL config, unused until now, kept for reference:
#   spring.datasource.url=jdbc:mysql://localhost:3306/metaml_wb_db
#   spring.datasource.username=wbuser
#   spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
# file, not mem. on mem every process instance, task, variable and history row went away the
# moment you stopped the app, so a restart mid-demo meant starting the walkthrough over. Camunda
# creates the schema itself on first boot and leaves it alone after that, so this needs no code.
# Path is relative to the launch directory, and spring-boot:run uses the module dir, so running
# it via mvnw from backend/ it ends up at backend/wbapi/data/camunda.mv.db. Delete that folder
# for a clean slate. Tests override this back to mem, they want a blank engine every time.
spring.datasource.url=jdbc:h2:file:./data/camunda;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configs
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
##(create, update, create-drop, validate)
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

# Camunda process engine
camunda.bpm.admin-user.id=${CAMUNDA_ADMIN_USER:demo}
# still demo/demo out of the box since that's what you log into cockpit with, but at least the
# checked-in password isn't the only option now
camunda.bpm.admin-user.password=${CAMUNDA_ADMIN_PASSWORD:demo}
camunda.bpm.filter.create=All tasks
# Default History Time To Live (days) for process definitions that don't set their own -
# required in Camunda 7.20+, since none of our demo BPMN models set historyTimeToLive.
camunda.bpm.generic-properties.properties.historyTimeToLive=180

## logging
# was DEBUG on both - that logs auth headers and session ids straight to the console, and there's
# no auth to debug here anyway since the filter chain is permitAll
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %magenta([%thread]) %highlight(%-5level) %logger.%M - %yellow(%msg%n)

# Spring Boot Generation (scope item 4). Relative to the launch directory, same story as the
# datasource path above - spring-boot:run's working directory is the module dir (backend/wbapi),
# so this needs the extra ../.. to reach the real template checked in at the repo root. Without
# this, generate-project 500s out of the box with "no template project" the moment someone runs
# the app the plain way instead of remembering to pass this as a one-off -D override.
workbench.generation.template-directory=../RedCollarTP

# Where each generated Target Platform is written. Deliberately a sibling of the Workbench
# repository, not a path under it: the Target Platform is a generated runtime application, not
# part of the Workbench - "generated by the Workbench" is not "part of the Workbench" (Joanna's
# Phase 2 correction). Same working-directory story as template-directory above, one hop further:
# backend/wbapi -> backend -> repo root -> repo root's own parent, then back down into a directory
# that lives next to the repo, not inside it.
workbench.generation.output-directory=../../../generated-target-platforms

## Begin Security Properties
# CORS Configuration
app.cors.allowed-origins=http://127.0.0.1:3000,http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
## End Security Properties
