spring.application.name=wbapi

#server configuration
# Loopback-only for this local demo setup: this port also serves the Camunda webapp
# (cockpit/admin/tasklist) with the default demo/demo admin account, and Spring Security is
# permitAll, so binding to 0.0.0.0 exposed a fully privileged process-engine console to
# anyone on the same network. The React app runs in a browser on this same machine and talks
# to http://localhost:8082, and the node manager call is outbound, so nothing local breaks.
server.address=127.0.0.1
server.port=8082

# Allow circular references (allow dependency cycle between beans)
# spring.main.allow-circular-references=true

# Datasource configs
# NOTE: switched from MySQL to H2 for Camunda (no MySQL server is installed/running on this
# machine, and Camunda's process engine needs a real, working datasource at boot).
# Original MySQL config, unused until now, kept for reference:
#   spring.datasource.url=jdbc:mysql://localhost:3306/metaml_wb_db
#   spring.datasource.username=wbuser
#   spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
# file, not mem. on mem every process instance, task, variable and history row went away the
# moment you stopped the app, so a restart mid-demo meant starting the walkthrough over. Camunda
# creates the schema itself on first boot and leaves it alone after that, so this needs no code.
# Path is relative to the launch directory, and spring-boot:run uses the module dir, so with the
# HOW_TO_RUN commands it ends up at backend/wbapi/data/camunda.mv.db. Delete that folder for a
# clean slate. Tests override this back to mem, they want a blank engine every time.
spring.datasource.url=jdbc:h2:file:./data/camunda;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configs
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
##(create, update, create-drop, validate)
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

# Camunda process engine
camunda.bpm.admin-user.id=${CAMUNDA_ADMIN_USER:demo}
# still demo/demo out of the box since that's what you log into cockpit with, but at least the
# checked-in password isn't the only option now
camunda.bpm.admin-user.password=${CAMUNDA_ADMIN_PASSWORD:demo}
camunda.bpm.filter.create=All tasks
# Default History Time To Live (days) for process definitions that don't set their own -
# required in Camunda 7.20+, since none of our demo BPMN models set historyTimeToLive.
camunda.bpm.generic-properties.properties.historyTimeToLive=180

## logging
# was DEBUG on both - that logs auth headers and session ids straight to the console, and there's
# no auth to debug here anyway since the filter chain is permitAll
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %magenta([%thread]) %highlight(%-5level) %logger.%M - %yellow(%msg%n)

## Begin Security Properties
# CORS Configuration
app.cors.allowed-origins=http://127.0.0.1:3000,http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
## End Security Properties