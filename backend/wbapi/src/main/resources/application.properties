spring.application.name=wbapi

#server configuration
# Loopback-only for this local demo setup: this port also serves the Camunda webapp
# (cockpit/admin/tasklist) with the default demo/demo admin account, and Spring Security is
# permitAll, so binding to 0.0.0.0 exposed a fully privileged process-engine console to
# anyone on the same network. The React app runs in a browser on this same machine and talks
# to http://localhost:8082, and the node manager call is outbound, so nothing local breaks.
server.address=127.0.0.1
server.port=8082

# Allow circular references (allow dependency cycle between beans)
# spring.main.allow-circular-references=true

# Datasource configs
# NOTE: switched from MySQL to H2 in-memory for Camunda (no MySQL server is installed/running
# on this machine, and Camunda's process engine needs a real, working datasource at boot).
# Original MySQL config, unused until now, kept for reference:
#   spring.datasource.url=jdbc:mysql://localhost:3306/metaml_wb_db
#   spring.datasource.username=wbuser
#   spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:h2:mem:metaml;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configs
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
##(create, update, create-drop, validate)
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

# Camunda process engine
camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
camunda.bpm.filter.create=All tasks
# Default History Time To Live (days) for process definitions that don't set their own -
# required in Camunda 7.20+, since none of our demo BPMN models set historyTimeToLive.
camunda.bpm.generic-properties.properties.historyTimeToLive=180

## logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %magenta([%thread]) %highlight(%-5level) %logger.%M - %yellow(%msg%n)

## Begin Security Properties
# CORS Configuration
app.cors.allowed-origins=http://127.0.0.1:3000,http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
## End Security Properties