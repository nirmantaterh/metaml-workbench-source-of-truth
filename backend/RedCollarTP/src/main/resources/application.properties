server.port=8080

camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
# Matches templates/camundademo's own engine name - ModelPage builds the Cockpit link as
# /camunda/app/cockpit/engine/ regardless of which template actually generated the running app,
# so both templates need to agree on this rather than one of them using Camunda's own "default".
camunda.bpm.process-engine-name=engine

spring.datasource.url=jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# Camunda 7.19+ refuses to deploy ANY process that has no historyTimeToLive set on it (ENGINE-09005),
# and the whole point of this template is to deploy whatever the user just modeled in the Workbench
# editor - a BPMN authored there has no reason to already carry that attribute. Disabling enforcement
# here, once, for every generated Target Platform is what actually matches that workflow; requiring
# every user-drawn proxy/twin BPMN to remember a Camunda-specific attribute would not.
camunda.bpm.generic-properties.properties.enforceHistoryTimeToLive=false

# On by default: the whole point of this template is proxy<->twin synchronization over a real
# broker (see TargetPlatformMessagingGenerator), not a demo flag someone has to remember to flip.
# A generated platform with no shared signal in its BPMNs still starts fine with this on - the
# RabbitListener beans it activates simply have nothing to bind if there are no shared signals.
metaml.messaging.enabled=true
# Retries connecting rather than failing startup outright if the broker isn't up yet when this
# process launches - a slower, noisier failure (server.port never opens, launch.log keeps retrying)
# is preferable to a fast one that then reads as "the generated project itself is broken" to
# SpringBootProjectLauncher.awaitReady, which was written to diagnose a COMPILE failure, not this.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-attempts=30
