spring.application.name=camundademo

# Actuator - manage endpoints
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.enabled=true
endpoints.shutdown.enabled=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
##(create, update, create-drop, validate)
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

# Camunda Primary DataSource Configuration - H2DB
spring.datasource.camunda.url=jdbc:h2:mem:process-engine;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.camunda.username=sa
spring.datasource.camunda.password=
spring.datasource.camunda.driver-class-name=org.h2.Driver

# Camunda Process Engine Configuration
camunda.bpm.process-engine-name=engine
camunda.bpm.database-schema-update=true
camunda.bpm.skip-isolation-level-check=true
camunda.bpm.history-level=full
camunda.bpm.enforce-history-time-to-live=false
camunda.bpm.job-executor-activate=false
# (ORIGINAL) camunda.bpm.enforce-history-time-to-live=true

# Location of BPMN process files
camunda.bpm.deployment-resource-pattern=classpath*:/processes/*.bpmn